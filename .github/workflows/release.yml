name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  BIN_NAME: claude-history

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: macos-15
            target: x86_64-apple-darwin
            platform: darwin-amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          dir="target/${{ matrix.target }}/release"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # Ship the bare .exe so Windows users can download and run it directly
            archive="${BIN_NAME}-${{ matrix.platform }}.exe"
            cp "$dir/${BIN_NAME}.exe" "$archive"
            sha256sum "$archive" > "${BIN_NAME}-${{ matrix.platform }}.sha256"
          else
            # Only strip on Linux to avoid corrupting macOS code signatures
            if [[ "${{ runner.os }}" == "Linux" ]]; then
              strip "$dir/${BIN_NAME}" || true
            fi
            archive="${BIN_NAME}-${{ matrix.platform }}.tar.gz"
            tar -C "$dir" -czf "$archive" ${BIN_NAME}
            shasum -a 256 "$archive" > "${BIN_NAME}-${{ matrix.platform }}.sha256"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: |
            ${{ env.BIN_NAME }}-${{ matrix.platform }}.tar.gz
            ${{ env.BIN_NAME }}-${{ matrix.platform }}.exe
            ${{ env.BIN_NAME }}-${{ matrix.platform }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.exe
            *.sha256

