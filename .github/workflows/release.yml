name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  BIN_NAME: claude-history

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: macos-15
            target: x86_64-apple-darwin
            platform: darwin-amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          dir="target/${{ matrix.target }}/release"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # Ship the bare .exe so Windows users can download and run it directly
            archive="${BIN_NAME}-${{ matrix.platform }}.exe"
            cp "$dir/${BIN_NAME}.exe" "$archive"
            sha256sum "$archive" > "${BIN_NAME}-${{ matrix.platform }}.sha256"
          else
            # Only strip on Linux to avoid corrupting macOS code signatures
            if [[ "${{ runner.os }}" == "Linux" ]]; then
              strip "$dir/${BIN_NAME}" || true
            fi
            archive="${BIN_NAME}-${{ matrix.platform }}.tar.gz"
            tar -C "$dir" -czf "$archive" ${BIN_NAME}
            shasum -a 256 "$archive" > "${BIN_NAME}-${{ matrix.platform }}.sha256"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: |
            ${{ env.BIN_NAME }}-${{ matrix.platform }}.tar.gz
            ${{ env.BIN_NAME }}-${{ matrix.platform }}.exe
            ${{ env.BIN_NAME }}-${{ matrix.platform }}.sha256

  # Publishes to crates.io with trusted publishing (no stored token); see
  # https://crates.io/docs/trusted-publishing. Runs only after every target built.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag matches Cargo.toml version
        id: version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          name=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already on crates.io
        id: exists
        shell: bash
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "${{ github.repository }} release workflow" \
            "https://crates.io/api/v1/crates/${{ steps.version.outputs.name }}/${{ steps.version.outputs.version }}")
          echo "published=$([[ $status == 200 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.exists.outputs.published == 'false'
        id: auth
      - name: Publish
        if: steps.exists.outputs.published == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.exe
            *.sha256

