[package]
name = "claude-history-resume"
version = "0.1.28"
edition = "2024"
description = "Fuzzy-search Claude Code conversation history from the terminal."
readme = "README.md"
license = "MIT"
repository = "https://github.com/chuilishi/claude-history"
homepage = "https://github.com/chuilishi/claude-history"
keywords = ["claude", "claude-code", "fzf", "cli", "history"]
categories = ["command-line-utilities"]
exclude = ["meta/", ".github/", "scripts/", ".workmux.yaml", "justfile", "RELEASE.md"]

# The crate name `claude-history` belongs to the upstream project on crates.io;
# the installed command keeps that name.
[[bin]]
name = "claude-history"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
thiserror = "2.0"
home = "0.5"
rayon = "1.10"
ratatui = "0.30"
unicode-width = "0.2"
crossterm = "0.29"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
